{% extends "base.html" %}
{% block title %}Create account - Auraflow{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create your account</h1>
  <p class="muted">For employees. Technician and admin accounts are created by the IT team.</p>
  <form method="post" action="{{ url_for('auth.register') }}">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" value="{{ name or '' }}" required autofocus>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" required>
    <label for="password">Password (at least 8 characters)</label>
    <input id="password" name="password" type="password" minlength="8" required>
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" minlength="8" required>
    <button class="full" type="submit">Create account</button>
  </form>
  <p class="small muted">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</div>
{% endblock %}
