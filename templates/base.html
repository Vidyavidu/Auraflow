<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Auraflow{% endblock %}</title>
  <style>
    :root {
      --bg: #C1D1CF;
      --card: #E4ECEA;
      --text: #171F22;
      --muted: #636467;
      --brand: #171F22;
      --brand-text: #C1D1CF;
      --accent: #748B91;
      --border: #A3B5B3;
      --header-bg: #171F22;
      --header-text: #C1D1CF;
      --input-bg: #F1F5F4;
      --error-bg: #EBD3D0; --error-text: #6E1F18;
      --ok-bg: #CFE3D6;    --ok-text: #1B4D31;
      --info-bg: #CBD9DC;  --info-text: #1F3A40;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171F22;
        --card: #1F292D;
        --text: #C1D1CF;
        --muted: #748B91;
        --brand: #748B91;
        --brand-text: #171F22;
        --accent: #748B91;
        --border: #363F43;
        --header-bg: #11171A;
        --header-text: #C1D1CF;
        --input-bg: #171F22;
        --error-bg: #3A2323; --error-text: #F0B9B3;
        --ok-bg: #1F3328;    --ok-text: #A9DDBD;
        --info-bg: #263539;  --info-text: #C1D1CF;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); line-height: 1.5; }
    header { display: flex; justify-content: space-between; align-items: center;
             gap: 12px; flex-wrap: wrap; padding: 14px 24px;
             background: var(--header-bg); border-bottom: 2px solid var(--accent); }
    .brand { font-weight: 700; font-size: 1.2rem; letter-spacing: .5px;
             color: var(--header-text); text-decoration: none; }
    .who { display: flex; align-items: center; gap: 12px; color: var(--header-text); font-size: .95rem; }
    .badge { background: var(--accent); color: #171F22; padding: 2px 10px;
             border-radius: 999px; font-size: .8rem; font-weight: 700; }
    main { max-width: 960px; margin: 32px auto; padding: 0 16px; }
    .card { background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 28px; }
    .narrow { max-width: 420px; margin: 0 auto; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: .92rem; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 1rem;
            border: 1px solid var(--border); background: var(--input-bg); color: var(--text); }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button, .btn { display: inline-block; cursor: pointer; border: 0; border-radius: 8px;
                   padding: 10px 18px; font-size: 1rem; font-weight: 600;
                   background: var(--brand); color: var(--brand-text); text-decoration: none; }
    button:hover, .btn:hover { filter: brightness(1.12); }
    button.full { width: 100%; margin-top: 20px; }
    button.ghost { background: transparent; color: var(--header-text);
                   border: 1px solid var(--muted); padding: 6px 12px; font-size: .9rem; }
    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: .95rem; }
    .flash.error { background: var(--error-bg); color: var(--error-text); }
    .flash.success { background: var(--ok-bg); color: var(--ok-text); }
    .flash.info { background: var(--info-bg); color: var(--info-text); }
    .muted { color: var(--muted); }
    .small { font-size: .9rem; margin-top: 18px; text-align: center; }
    a { color: var(--text); text-decoration-color: var(--accent); text-underline-offset: 3px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Auraflow</a>
    {% if g.user %}
    <div class="who">
      <span>{{ g.user.name }}</span>
      <span class="badge">{{ g.user.role | upper }}</span>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <button class="ghost" type="submit">Sign out</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
