{% extends "base.html" %}
{% block title %}Sign in - Auraflow{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Welcome back to Auraflow IT support.</p>
  <form method="post" action="{{ url_for('auth.login') }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <button class="full" type="submit">Sign in</button>
  </form>
  <p class="small muted">New employee? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
