<style>
  :root {
    --warn-bg: #EADFC4; --warn-text: #5B4410;
  }
  @media (prefers-color-scheme: dark) {
    :root { --warn-bg: #3A3322; --warn-text: #E8D39B; }
  }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px;
          font-size: .78rem; font-weight: 700; white-space: nowrap;
          background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .pill.low, .pill.on_track, .pill.met { background: var(--ok-bg); color: var(--ok-text); border-color: transparent; }
  .pill.medium { background: var(--info-bg); color: var(--info-text); border-color: transparent; }
  .pill.high, .pill.at_risk { background: var(--warn-bg); color: var(--warn-text); border-color: transparent; }
  .pill.critical, .pill.breached { background: var(--error-bg); color: var(--error-text); border-color: transparent; }
  .scroll-x { overflow-x: auto; }
  table.tickets { width: 100%; border-collapse: collapse; font-size: .93rem; }
  table.tickets th, table.tickets td { text-align: left; padding: 10px 12px;
        border-bottom: 1px solid var(--border); vertical-align: top; }
  table.tickets th { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .4px; }
  .topbar { display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .topbar h1 { margin: 0; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  textarea { width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 1rem;
             font-family: inherit; min-height: 140px; resize: vertical;
             border: 1px solid var(--border); background: var(--input-bg); color: var(--text); }
  textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  select { width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 1rem;
           border: 1px solid var(--border); background: var(--input-bg); color: var(--text); }
</style>
